<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Quiz SIPAT 2026</title><link rel="stylesheet" href="/app.css"><style>
