<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel Admin - Quiz SIPAT 2026</title><link rel="stylesheet" href="/app.css"><style>

-admin .avatar-circle{width:38px;height:38px}.iconbtn{border:0;background:#203544;color:#d8e4ea;width:30px;height:30px;border-radius:8px;cursor:pointer}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:14px}.field label{display:block;color:#8da7b7;font-size:12px;font-weight:800;margin-bottom:6px}.input{width:100%;background:#0b1923;border:1px solid #2b4354;color:white;border-radius:10px;padding:11px 12px}.switchline{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid #203340}.switch{width:48px;height:26px;border-radius:999px;background:#2c4150;position:relative;cursor:pointer}.switch:after{content:"";position:absolute;width:20px;height:20px;top:3px;left:3px;background:white;border-radius:50%;transition:.18s}.switch.on{background:#18bd70}.switch.on:after{left:25px}.q-editor{display:flex;flex-direction:column;gap:14px}.q-card{padding:17px}.q-card .top{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:12px}.q-card textarea{min-height:72px;resize:vertical}.q-answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.q-answer{display:grid;grid-template-columns:38px 1fr;gap:7px;align-items:center}.q-answer b{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:white}.hidden{display:none!important}.statusline{padding:13px 15px;border-radius:12px;background:#10222f;border:1px solid #284253;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}.small{font-size:12px}.question-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.question-toolbar .btn{padding:10px 14px}@media(max-width:1100px){.admin-shell{grid-template-columns:1fr}.sidebar{display:none}.grid{grid-template-columns:1fr}.control-row{grid-template-columns:repeat(3,1fr)}}
